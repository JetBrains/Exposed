# This workflow performs a static analysis of your Kotlin source code using detekt.
#
# Scans are triggered on every pull request targeting the main, develop/*, and release/* branches.

name: detekt

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Triggers the workflow on pull request events targeting the main, develop/*, and release/* branches
  pull_request:
    branches:
      - main
      - develop/*
      - release/*

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "detekt"
  detekt:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    steps:
      # Checks out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: "checkout"
        uses: actions/checkout@v2
      # Determines changed files
      - name: "changed-files"
        env:
          # Base branch of the pull request; falls back to main for workflow_dispatch runs
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          git fetch origin "$BASE_REF":refs/remotes/origin/"$BASE_REF"
          # NUL-delimited list: a filename with spaces must survive as one item
          CHANGED_FILES_LIST="$RUNNER_TEMP/changed-files.txt"
          git --no-pager diff --name-only --diff-filter=dr -z origin/"$BASE_REF" HEAD \
            | grep -z '\(.*.kt\|.*.kts\)$' \
            | grep -zv '/MavenProjectGeneration.kt$' \
            | grep -zv '/src/test/resources/template/sourceFiles/' \
            > "$CHANGED_FILES_LIST" || true
          echo "Changed files:"
          tr '\0' '\n' < "$CHANGED_FILES_LIST"
          echo "CHANGED_FILES_LIST=$CHANGED_FILES_LIST" >> "$GITHUB_ENV"
      # Resolves and installs a specific version of detekt on to a GitHub Actions Runner if not already present in the tool cache
      - name: "set-up-detekt"
        uses: peter-murray/setup-detekt@v2
        with:
          detekt_version: 1.23.8
      # Runs detekt on changed files
      - name: "run-detekt"
        run: |
          mapfile -d '' -t CHANGED_FILES < "$CHANGED_FILES_LIST"
          if [ "${#CHANGED_FILES[@]}" -eq 0 ]
          then
            echo "No changed Kotlin files found."
            exit 0
          fi

          echo "Running detekt check..."
          CHANGED_FILES_INPUT=""
          for file in "${CHANGED_FILES[@]}"
          do
            CHANGED_FILES_INPUT+="${CHANGED_FILES_INPUT:+,}$file"
          done
          DETEKT_ISSUES=$(detekt-cli --build-upon-default-config --config detekt/detekt-config.yml --plugins detekt/detekt-formatting-1.23.8.jar --input "$CHANGED_FILES_INPUT")
          if [ -n "$DETEKT_ISSUES" ]; then
            echo "***********************************************"
            echo "$DETEKT_ISSUES"
            echo "***********************************************"
            echo "                 detekt failed                 "
            echo "        Please fix the above issues            "
            echo "***********************************************"
            exit 1
          fi
